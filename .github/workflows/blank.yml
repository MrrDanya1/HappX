name: HappX Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract engine-stage archive
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p stage
          unzip -o HappX-Android-engine-stage.zip -d stage

      - name: Inspect Android VPN source
        run: |
          echo "===== MainActivity.kt ====="
          sed -n '1,520p' stage/app/src/main/java/app/happx/MainActivity.kt
          echo "===== HappXVpnService.kt ====="
          cat stage/app/src/main/java/app/happx/HappXVpnService.kt
          echo "===== HappXApplication.kt ====="
          cat stage/app/src/main/java/app/happx/HappXApplication.kt
          echo "===== AndroidManifest.xml ====="
          cat stage/app/src/main/AndroidManifest.xml
          echo "===== build.gradle.kts ====="
          cat stage/app/build.gradle.kts

      - name: Align Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("stage/app/build.gradle.kts")
          if not p.exists():
              raise SystemExit("Missing stage/app/build.gradle.kts")
          s = p.read_text()
          # Normalize common Java 8 target spellings.
          s = s.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
          s = s.replace("VERSION_1_8", "VERSION_17")
          s = re.sub(r'(["\'])1\.8(["\'])', r'\g<1>17\g<2>', s)
          # Explicitly set Android's Java bytecode target to 17.
          if "compileOptions" in s:
              s = re.sub(
                  r'compileOptions\s*\{.*?\}',
                  'compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }',
                  s, count=1, flags=re.S
              )
          elif re.search(r'android\s*\{', s):
              s = re.sub(
                  r'android\s*\{',
                  'android {\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }',
                  s, count=1
              )
          else:
              raise SystemExit("Could not find android { block in app/build.gradle.kts")
          # Enable BuildConfig generation on Android Gradle Plugin 8+.
          if not re.search(r'buildConfig\s*=\s*true', s):
              s = re.sub(r'android\s*\{', 'android {\n    buildFeatures { buildConfig = true }', s, count=1)
          p.write_text(s)
          print("Updated compile targets and BuildConfig in", p)
          print("\n".join(s.splitlines()[:100]))
          print("Patched Java/Kotlin targets and button colors.")
          # Inside Button.apply, unqualified `text` resolves to the button label,
          # not the outer color value. Use a concrete Android text color.
          main = Path("stage/app/src/main/java/app/happx/MainActivity.kt")
          code = main.read_text()
          code = code.replace("setTextColor(text)", "setTextColor(android.graphics.Color.WHITE)")
          main.write_text(code)
          print("Patched button text colors in", main)
          PY

      - name: Fix subscription import and add TCP ping sorting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          main = Path("stage/app/src/main/java/app/happx/MainActivity.kt")
          code = main.read_text()

          def require_replace(old, new, label):
              global code
              if old not in code:
                  raise SystemExit("Could not patch " + label + ": source pattern not found")
              code = code.replace(old, new, 1)

          require_replace(
              "import android.os.Bundle\n",
              "import android.os.Bundle\nimport android.os.SystemClock\nimport android.util.Base64\nimport org.json.JSONObject\nimport java.net.InetSocketAddress\nimport java.net.Socket\nimport java.net.URI\nimport java.net.URL\nimport java.net.HttpURLConnection\nimport java.util.concurrent.CountDownLatch\nimport java.util.concurrent.Executors\nimport kotlin.concurrent.thread\n",
              "imports"
          )
          require_replace(
              "    private var connected = false\n",
              "    private var connected = false\n    private val pingMs = mutableMapOf<String, Long>()\n    private var sortingByPing = false\n    private lateinit var sortButton: Button\n",
              "ping state"
          )

          old_tools = '''        serverList = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  content.addView(serverList)'''
          new_tools = '''        val serverTools = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
          val pingButton = Button(this).apply {
              text = "Проверить пинг"
              isAllCaps = false
              setTextColor(Color.WHITE)
              setBackgroundTintList(android.content.res.ColorStateList.valueOf(panel))
              setOnClickListener { checkPings() }
          }
          sortButton = Button(this).apply {
              text = "Без сортировки"
              isAllCaps = false
              setTextColor(Color.WHITE)
              setBackgroundTintList(android.content.res.ColorStateList.valueOf(panel))
              setOnClickListener {
                  sortingByPing = !sortingByPing
                  refreshServers()
              }
          }
          serverTools.addView(pingButton, LinearLayout.LayoutParams(0, dp(48), 1f))
          serverTools.addView(Space(this), LinearLayout.LayoutParams(dp(8), 1))
          serverTools.addView(sortButton, LinearLayout.LayoutParams(0, dp(48), 1f))
          content.addView(serverTools, marginParams(bottom = 8))
          serverList = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
          content.addView(serverList)'''
          require_replace(old_tools, new_tools, "ping and sort controls")

          start = code.index("    private fun showImportDialog() {")
          end = code.index("    private fun refreshServers() {", start)
          import_method = r'''    private fun showImportDialog() {
          val box = LinearLayout(this).apply {
              orientation = LinearLayout.VERTICAL
              setPadding(dp(20), dp(8), dp(20), 0)
          }
          val nameInput = EditText(this).apply {
              hint = "Название сервера или подписки"
              setSingleLine(true)
          }
          val urlInput = EditText(this).apply {
              hint = "VLESS/VMess/Trojan или HTTPS-ссылка подписки"
              setSingleLine(true)
              inputType = android.text.InputType.TYPE_CLASS_TEXT or
                  android.text.InputType.TYPE_TEXT_VARIATION_URI
          }
          box.addView(nameInput)
          box.addView(urlInput)
          AlertDialogBuilder(this)
              .setTitle("Добавить сервер или подписку")
              .setView(box)
              .setNegativeButton("Отмена", null)
              .setPositiveButton("Импортировать") { _, _ ->
                  val link = urlInput.text.toString().trim()
                  val customName = nameInput.text.toString().trim()
                  if (link.isBlank()) {
                      Toast.makeText(this, "Вставь ссылку.", Toast.LENGTH_SHORT).show()
                  } else {
                      val isShareLink = link.startsWith("vless://", true) ||
                          link.startsWith("vmess://", true) || link.startsWith("trojan://", true)
                      val isSubscription = link.startsWith("https://", true) ||
                          link.startsWith("http://", true)
                      if (!isShareLink && !isSubscription) {
                          Toast.makeText(this, "Поддерживаются VLESS, VMess, Trojan и HTTP(S)-подписки.", Toast.LENGTH_LONG).show()
                      } else if (isShareLink) {
                          try {
                              val parsed = SingBoxConfigBuilder.parseShareLink(link)
                              val name = customName.ifBlank { parsed.name.ifBlank { "Сервер ${servers.size + 1}" } }
                              val entry = "$name|$link"
                              if (entry !in servers) servers.add(entry)
                              serverConfigs[entry] = parsed.configJson
                              selectedIndex = servers.indexOf(entry)
                              persistServers()
                              refreshServers()
                              Toast.makeText(this, "Профиль ${parsed.type} импортирован.", Toast.LENGTH_LONG).show()
                          } catch (e: Exception) {
                              Toast.makeText(this, e.message ?: "Не удалось разобрать ссылку.", Toast.LENGTH_LONG).show()
                          }
                      } else {
                          Toast.makeText(this, "Загружаю подписку…", Toast.LENGTH_SHORT).show()
                          thread(name = "happx-subscription-import") {
                              try {
                                  val connection = (URL(link).openConnection() as HttpURLConnection).apply {
                                      connectTimeout = 12000
                                      readTimeout = 18000
                                      instanceFollowRedirects = true
                                      setRequestProperty("User-Agent", "HappX-Android")
                                  }
                                  val body = try {
                                      val response = connection.responseCode
                                      if (response !in 200..299) throw IllegalStateException("Сервер подписки ответил HTTP $response")
                                      connection.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                                  } finally {
                                      connection.disconnect()
                                  }
                                  val links = extractShareLinks(body)
                                  if (links.isEmpty()) throw IllegalStateException("В ответе нет ссылок VLESS/VMess/Trojan. Проверь ссылку подписки.")
                                  val parsedProfiles = links.mapNotNull { item ->
                                      runCatching { item to SingBoxConfigBuilder.parseShareLink(item) }.getOrNull()
                                  }
                                  if (parsedProfiles.isEmpty()) throw IllegalStateException("Ссылки найдены, но ни одна не распознана. Проверь формат подписки.")
                                  runOnUiThread {
                                      var added = 0
                                      parsedProfiles.forEachIndexed { i, pair ->
                                          val item = pair.first
                                          val profile = pair.second
                                          val label = when {
                                              customName.isBlank() -> profile.name.ifBlank { "Сервер ${servers.size + i + 1}" }
                                              parsedProfiles.size == 1 -> customName
                                              else -> "$customName ${i + 1}"
                                          }
                                          val entry = "$label|$item"
                                          if (entry !in servers) {
                                              servers.add(entry)
                                              added++
                                          }
                                          serverConfigs[entry] = profile.configJson
                                          pingMs.remove(entry)
                                      }
                                      val lastEntry = parsedProfiles.last().let { pair ->
                                          val profile = pair.second
                                          val label = when {
                                              customName.isBlank() -> profile.name.ifBlank { "Сервер ${servers.size}" }
                                              parsedProfiles.size == 1 -> customName
                                              else -> "$customName ${parsedProfiles.size}"
                                          }
                                          "$label|${pair.first}"
                                      }
                                      selectedIndex = servers.indexOf(lastEntry).takeIf { it >= 0 } ?: servers.lastIndex
                                      persistServers()
                                      refreshServers()
                                      Toast.makeText(this, "Импортировано серверов: $added из ${parsedProfiles.size}.", Toast.LENGTH_LONG).show()
                                  }
                              } catch (e: Exception) {
                                  runOnUiThread {
                                      Toast.makeText(this, e.message ?: "Не удалось загрузить подписку.", Toast.LENGTH_LONG).show()
                                  }
                              }
                          }
                      }
                  }
              }.show()
          }

          private fun extractShareLinks(rawBody: String): List<String> {
          fun supportedLines(value: String): List<String> = value
              .removePrefix("\uFEFF")
              .lineSequence()
              .map { it.trim().trim('"', '\'') }
              .filter { line ->
                  line.startsWith("vless://", true) ||
                      line.startsWith("vmess://", true) ||
                      line.startsWith("trojan://", true)
              }
              .distinct()
              .toList()

          val direct = supportedLines(rawBody)
          if (direct.isNotEmpty()) return direct
          val compact = rawBody.trim().filterNot { it.isWhitespace() }
          val decoded = runCatching {
              String(Base64.decode(compact, Base64.DEFAULT or Base64.URL_SAFE), Charsets.UTF_8)
          }.getOrNull() ?: return emptyList()
          return supportedLines(decoded)
          }

          private fun checkPings() {
          val targets = servers.toList()
          if (targets.isEmpty()) {
              Toast.makeText(this, "Сначала импортируй серверы или подписку.", Toast.LENGTH_SHORT).show()
              return
          }
          Toast.makeText(this, "Проверяю TCP-задержку серверов…", Toast.LENGTH_SHORT).show()
          val pool = Executors.newFixedThreadPool(6)
          val latch = CountDownLatch(targets.size)
          val results = java.util.Collections.synchronizedMap(mutableMapOf<String, Long>())
          targets.forEach { entry ->
              pool.execute {
                  try {
                      val endpoint = endpointFor(entry.substringAfter("|", ""))
                      results[entry] = if (endpoint == null) -1L else tcpLatency(endpoint.first, endpoint.second)
                  } catch (_: Exception) {
                      results[entry] = -1L
                  } finally {
                      latch.countDown()
                  }
              }
          }
          thread(name = "happx-ping-results") {
              latch.await()
              pool.shutdown()
              runOnUiThread {
                  pingMs.putAll(results)
                  sortingByPing = true
                  refreshServers()
                  val reachable = results.values.count { it >= 0 }
                  Toast.makeText(this, "Проверка завершена: $reachable из ${targets.size} серверов доступны по TCP.", Toast.LENGTH_LONG).show()
              }
          }
          }

          private fun endpointFor(link: String): Pair<String, Int>? {
          if (link.startsWith("vmess://", true)) {
              val encoded = link.substringAfter("://").substringBefore("#").trim()
              val jsonText = runCatching {
                  String(Base64.decode(encoded, Base64.DEFAULT or Base64.URL_SAFE), Charsets.UTF_8)
              }.getOrNull() ?: return null
              val json = JSONObject(jsonText)
              val host = json.optString("add").trim()
              val port = json.optString("port").toIntOrNull() ?: json.optInt("port", -1)
              return if (host.isNotBlank() && port in 1..65535) host to port else null
          }
          val uri = runCatching { URI(link) }.getOrNull() ?: return null
          val host = uri.host?.takeIf { it.isNotBlank() } ?: return null
          val port = uri.port
          return if (port in 1..65535) host to port else null
          }

          private fun tcpLatency(host: String, port: Int): Long {
          Socket().use { socket ->
              val started = SystemClock.elapsedRealtime()
              socket.connect(InetSocketAddress(host, port), 1800)
              return (SystemClock.elapsedRealtime() - started).coerceAtLeast(1L)
          }
          }

          '''
          code = code[:start] + import_method + code[end:]

          require_replace(
              "        serverList.removeAllViews()\n",
              "        serverList.removeAllViews()\n        if (::sortButton.isInitialized) sortButton.text = if (sortingByPing) \"Сортировка: пинг\" else \"Без сортировки\"\n",
              "sort label"
          )
          require_replace(
              "        servers.forEachIndexed { index, entry ->\n",
              "        val displayServers = if (sortingByPing) servers.sortedWith(compareBy<String> { pingMs[it] ?: Long.MAX_VALUE }.thenBy { it.substringBefore(\"|\") }) else servers.toList()\n        displayServers.forEach { entry ->\n            val index = servers.indexOf(entry)\n",
              "display sort"
          )
          require_replace(
              "            info.addView(label(name, 15, text, true))\n",
              "            info.addView(label(name, 15, text, true))\n            val latency = pingMs[entry]\n            info.addView(label(if (latency == null) \"TCP: не проверен\" else if (latency >= 0) \"TCP: ${latency} ms\" else \"TCP: нет ответа\", 11, muted, false).apply { setPadding(0, dp(3), 0, 0) })\n",
              "latency label"
          )

          main.write_text(code)

          manifest = Path("stage/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              xml = manifest.read_text()
              if "android.permission.INTERNET" not in xml:
                  xml = re.sub(r"(<manifest\b[^>]*>)", r"\1\n    <uses-permission android:name=\"android.permission.INTERNET\" />", xml, count=1)
                  manifest.write_text(xml)
          else:
              raise SystemExit("AndroidManifest.xml not found; cannot enable subscription networking")
          print("Patched subscription downloading, VLESS/VMess/Trojan extraction, TCP latency checks, ping sorting, and INTERNET permission.")
          PY

      - name: Configure ARM64-only APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("stage/app/build.gradle.kts")
          s = p.read_text()
          if "isUniversalApk = false" not in s:
              block = '''
              splits {
                  abi {
                      isEnable = true
                      reset()
                      include("arm64-v8a")
                      isUniversalApk = false
                  }
              }
          '''
              s, n = re.subn(r'(android\s*\{)', lambda m: m.group(1) + block, s, count=1)
              if n != 1:
                  raise SystemExit("Could not configure Android ABI split")
              p.write_text(s)
          print("Configured ARM64-only APK")
          PY

      - name: Set up Gradle (project archive has no gradlew wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build smaller ARM64 APKs
        run: |
          test -f stage/settings.gradle.kts || test -f stage/settings.gradle
          gradle -p stage --no-daemon assembleDebug assembleRelease

      - name: Report APK size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [p for p in Path("stage").glob("**/build/outputs/apk/**/*.apk") if "debug" in p.parts or "release" in p.parts]
          if not files:
              raise SystemExit("No APKs were produced")
          limit = 100 * 1024 * 1024
          for apk in files:
              size = apk.stat().st_size
              print(f"APK: {apk}")
              print(f"Size: {size:,} bytes ({size / 1024 / 1024:.2f} MiB)")
              print(f"Target: 100 MiB — {'PASS' if size <= limit else 'OVER TARGET'}")
          PY

      - name: Upload installable arm64 debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HappX-debug-arm64-APK
          path: stage/**/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload arm64 release APK (unsigned)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HappX-release-arm64-unsigned
          path: stage/**/build/outputs/apk/release/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 7
