name: HappX Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract engine-stage archive
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p stage
          unzip -o HappX-Android-engine-stage.zip -d stage

      - name: Align Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("stage/app/build.gradle.kts")
          if not p.exists():
              raise SystemExit("Missing stage/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("VERSION_1_8", "VERSION_17")
          s = s.replace('JavaVersion.VERSION_1_8', 'JavaVersion.VERSION_17')
          p.write_text(s)
          print("Aligned Java compile target to 17 in", p)
          PY

      - name: Set up Gradle (project archive has no gradlew wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: |
          test -f stage/settings.gradle.kts || test -f stage/settings.gradle
          gradle -p stage --no-daemon assembleDebug

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HappX-debug-APK
          path: stage/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
