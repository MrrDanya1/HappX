name: HappX Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract engine-stage archive
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p stage
          unzip -o HappX-Android-engine-stage.zip -d stage

      - name: Set up Go for Xray core
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Set up Android SDK for Xray core
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Android NDK for Xray core
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: true

      - name: Set up Java 21 for libXray build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build official XTLS libXray Android library
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/XTLS/libXray.git /tmp/libXray
          cd /tmp/libXray
          python3 build/main.py android
          test -s libXray.aar
          mkdir -p "$GITHUB_WORKSPACE/stage/app/libs"
          cp libXray.aar "$GITHUB_WORKSPACE/stage/app/libs/libXray.aar"
          ls -lh "$GITHUB_WORKSPACE/stage/app/libs/libXray.aar"

      - name: Restore Java 17 for HappX app build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Inspect Android VPN source
        run: |
          echo "===== MainActivity.kt ====="
          sed -n '1,520p' stage/app/src/main/java/app/happx/MainActivity.kt
          echo "===== HappXVpnService.kt ====="
          cat stage/app/src/main/java/app/happx/HappXVpnService.kt
          echo "===== HappXApplication.kt ====="
          cat stage/app/src/main/java/app/happx/HappXApplication.kt
          echo "===== AndroidManifest.xml ====="
          cat stage/app/src/main/AndroidManifest.xml
          echo "===== build.gradle.kts ====="
          cat stage/app/build.gradle.kts

      - name: Align Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("stage/app/build.gradle.kts")
          if not p.exists():
              raise SystemExit("Missing stage/app/build.gradle.kts")
          s = p.read_text()
          # Normalize common Java 8 target spellings.
          s = s.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
          s = s.replace("VERSION_1_8", "VERSION_17")
          s = re.sub(r'(["\'])1\.8(["\'])', r'\g<1>17\g<2>', s)
          # Explicitly set Android's Java bytecode target to 17.
          if "compileOptions" in s:
              s = re.sub(
                  r'compileOptions\s*\{.*?\}',
                  'compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }',
                  s, count=1, flags=re.S
              )
          elif re.search(r'android\s*\{', s):
              s = re.sub(
                  r'android\s*\{',
                  'android {\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }',
                  s, count=1
              )
          else:
              raise SystemExit("Could not find android { block in app/build.gradle.kts")
          # Enable BuildConfig generation on Android Gradle Plugin 8+.
          if not re.search(r'buildConfig\s*=\s*true', s):
              s = re.sub(r'android\s*\{', 'android {\n    buildFeatures { buildConfig = true }', s, count=1)
          p.write_text(s)
          print("Updated compile targets and BuildConfig in", p)
          print("\n".join(s.splitlines()[:100]))
          print("Patched Java/Kotlin targets and button colors.")
          # Inside Button.apply, unqualified `text` resolves to the button label,
          # not the outer color value. Use a concrete Android text color.
          main = Path("stage/app/src/main/java/app/happx/MainActivity.kt")
          code = main.read_text()
          code = code.replace("setTextColor(text)", "setTextColor(android.graphics.Color.WHITE)")
          main.write_text(code)
          print("Patched button text colors in", main)
          PY

      - name: Fix subscription import and add TCP ping sorting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          main = Path("stage/app/src/main/java/app/happx/MainActivity.kt")
          code = main.read_text()

          def require_replace(old, new, label):
              global code
              if old not in code:
                  raise SystemExit("Could not patch " + label + ": source pattern not found")
              code = code.replace(old, new, 1)

          require_replace(
              "import android.os.Bundle\n",
              "import android.os.Bundle\nimport android.os.SystemClock\nimport android.util.Base64\nimport org.json.JSONObject\nimport java.net.InetSocketAddress\nimport java.net.Socket\nimport java.net.URI\nimport java.net.URL\nimport java.net.HttpURLConnection\nimport java.util.concurrent.CountDownLatch\nimport java.util.concurrent.Executors\nimport kotlin.concurrent.thread\n",
              "imports"
          )
          require_replace(
              "    private var connected = false\n",
              "    private var connected = false\n    private val pingMs = mutableMapOf<String, Long>()\n    private var sortingByPing = false\n    private lateinit var sortButton: Button\n",
              "ping state"
          )

          old_tools = '''        serverList = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  content.addView(serverList)'''
          new_tools = '''        val serverTools = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
          val pingButton = Button(this).apply {
              text = "Проверить пинг"
              isAllCaps = false
              setTextColor(Color.WHITE)
              setBackgroundTintList(android.content.res.ColorStateList.valueOf(panel))
              setOnClickListener { checkPings() }
          }
          sortButton = Button(this).apply {
              text = "Без сортировки"
              isAllCaps = false
              setTextColor(Color.WHITE)
              setBackgroundTintList(android.content.res.ColorStateList.valueOf(panel))
              setOnClickListener {
                  sortingByPing = !sortingByPing
                  refreshServers()
              }
          }
          serverTools.addView(pingButton, LinearLayout.LayoutParams(0, dp(48), 1f))
          serverTools.addView(Space(this), LinearLayout.LayoutParams(dp(8), 1))
          serverTools.addView(sortButton, LinearLayout.LayoutParams(0, dp(48), 1f))
          content.addView(serverTools, marginParams(bottom = 8))
          serverList = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
          content.addView(serverList)'''
          require_replace(old_tools, new_tools, "ping and sort controls")

          start = code.index("    private fun showImportDialog() {")
          end = code.index("    private fun refreshServers() {", start)
          import_method = r'''    private fun showImportDialog() {
          val box = LinearLayout(this).apply {
              orientation = LinearLayout.VERTICAL
              setPadding(dp(20), dp(8), dp(20), 0)
          }
          val nameInput = EditText(this).apply {
              hint = "Название сервера или подписки"
              setSingleLine(true)
          }
          val urlInput = EditText(this).apply {
              hint = "VLESS/VMess/Trojan или HTTPS-ссылка подписки"
              setSingleLine(true)
              inputType = android.text.InputType.TYPE_CLASS_TEXT or
                  android.text.InputType.TYPE_TEXT_VARIATION_URI
          }
          box.addView(nameInput)
          box.addView(urlInput)
          AlertDialogBuilder(this)
              .setTitle("Добавить сервер или подписку")
              .setView(box)
              .setNegativeButton("Отмена", null)
              .setPositiveButton("Импортировать") { _, _ ->
                  val link = urlInput.text.toString().trim()
                  val customName = nameInput.text.toString().trim()
                  if (link.isBlank()) {
                      Toast.makeText(this, "Вставь ссылку.", Toast.LENGTH_SHORT).show()
                  } else {
                      val isShareLink = link.startsWith("vless://", true) ||
                          link.startsWith("vmess://", true) || link.startsWith("trojan://", true)
                      val isSubscription = link.startsWith("https://", true) ||
                          link.startsWith("http://", true)
                      if (!isShareLink && !isSubscription) {
                          Toast.makeText(this, "Поддерживаются VLESS, VMess, Trojan и HTTP(S)-подписки.", Toast.LENGTH_LONG).show()
                      } else if (isShareLink) {
                          try {
                              val parsed = SingBoxConfigBuilder.parseShareLink(link)
                              val name = customName.ifBlank { parsed.name.ifBlank { "Сервер ${servers.size + 1}" } }
                              val entry = "$name|$link"
                              if (entry !in servers) servers.add(entry)
                              serverConfigs[entry] = parsed.configJson
                              selectedIndex = servers.indexOf(entry)
                              persistServers()
                              refreshServers()
                              Toast.makeText(this, "Профиль ${parsed.type} импортирован.", Toast.LENGTH_LONG).show()
                          } catch (e: Exception) {
                              Toast.makeText(this, e.message ?: "Не удалось разобрать ссылку.", Toast.LENGTH_LONG).show()
                          }
                      } else {
                          Toast.makeText(this, "Загружаю подписку…", Toast.LENGTH_SHORT).show()
                          thread(name = "happx-subscription-import") {
                              try {
                                  val connection = (URL(link).openConnection() as HttpURLConnection).apply {
                                      connectTimeout = 12000
                                      readTimeout = 18000
                                      instanceFollowRedirects = true
                                      setRequestProperty("User-Agent", "HappX-Android")
                                  }
                                  val body = try {
                                      val response = connection.responseCode
                                      if (response !in 200..299) throw IllegalStateException("Сервер подписки ответил HTTP $response")
                                      connection.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                                  } finally {
                                      connection.disconnect()
                                  }
                                  val links = extractShareLinks(body)
                                  if (links.isEmpty()) throw IllegalStateException("В ответе нет ссылок VLESS/VMess/Trojan. Проверь ссылку подписки.")
                                  val parsedProfiles = links.mapNotNull { item ->
                                      runCatching { item to SingBoxConfigBuilder.parseShareLink(item) }.getOrNull()
                                  }
                                  if (parsedProfiles.isEmpty()) throw IllegalStateException("Ссылки найдены, но ни одна не распознана. Проверь формат подписки.")
                                  runOnUiThread {
                                      var added = 0
                                      parsedProfiles.forEachIndexed { i, pair ->
                                          val item = pair.first
                                          val profile = pair.second
                                          val label = when {
                                              customName.isBlank() -> profile.name.ifBlank { "Сервер ${servers.size + i + 1}" }
                                              parsedProfiles.size == 1 -> customName
                                              else -> "$customName ${i + 1}"
                                          }
                                          val entry = "$label|$item"
                                          if (entry !in servers) {
                                              servers.add(entry)
                                              added++
                                          }
                                          serverConfigs[entry] = profile.configJson
                                          pingMs.remove(entry)
                                      }
                                      val lastEntry = parsedProfiles.last().let { pair ->
                                          val profile = pair.second
                                          val label = when {
                                              customName.isBlank() -> profile.name.ifBlank { "Сервер ${servers.size}" }
                                              parsedProfiles.size == 1 -> customName
                                              else -> "$customName ${parsedProfiles.size}"
                                          }
                                          "$label|${pair.first}"
                                      }
                                      selectedIndex = servers.indexOf(lastEntry).takeIf { it >= 0 } ?: servers.lastIndex
                                      persistServers()
                                      refreshServers()
                                      Toast.makeText(this, "Импортировано серверов: $added из ${parsedProfiles.size}.", Toast.LENGTH_LONG).show()
                                  }
                              } catch (e: Exception) {
                                  runOnUiThread {
                                      Toast.makeText(this, e.message ?: "Не удалось загрузить подписку.", Toast.LENGTH_LONG).show()
                                  }
                              }
                          }
                      }
                  }
              }.show()
          }

          private fun extractShareLinks(rawBody: String): List<String> {
          val linkRegex = Regex("(?i)(?:vless|vmess|trojan)://[^\\s\\\"'<>]+")
          fun supportedLinks(value: String): List<String> = linkRegex.findAll(value)
              .map { it.value.trim().trimEnd(',', ';', ')', ']', '}') }
              .filter { it.contains('@') || it.startsWith("vmess://", true) }
              .distinct()
              .toList()

          val queue = ArrayDeque<String>()
          val seen = mutableSetOf<String>()
          queue.add(rawBody.removePrefix("\\uFEFF").trim())
          repeat(3) {
              val currentBatch = queue.toList()
              queue.clear()
              for (value in currentBatch) {
                  if (value.isBlank() || !seen.add(value)) continue
                  val links = supportedLinks(value)
                  if (links.isNotEmpty()) return links
                  val compact = value.filterNot { it.isWhitespace() }
                  if (compact.length >= 16) {
                      for (flags in listOf(Base64.DEFAULT, Base64.URL_SAFE, Base64.NO_WRAP, Base64.URL_SAFE or Base64.NO_WRAP)) {
                          val decoded = runCatching {
                              String(Base64.decode(compact, flags), Charsets.UTF_8)
                          }.getOrNull()
                          if (!decoded.isNullOrBlank() && decoded != value && decoded.any { it.isLetterOrDigit() }) {
                              queue.add(decoded)
                          }
                      }
                  }
              }
          }
          return emptyList()
          }

          private fun checkPings() {
          val targets = servers.toList()
          if (targets.isEmpty()) {
              Toast.makeText(this, "Сначала импортируй серверы или подписку.", Toast.LENGTH_SHORT).show()
              return
          }
          Toast.makeText(this, "Проверяю TCP-задержку серверов…", Toast.LENGTH_SHORT).show()
          val pool = Executors.newFixedThreadPool(6)
          val latch = CountDownLatch(targets.size)
          val results = java.util.Collections.synchronizedMap(mutableMapOf<String, Long>())
          targets.forEach { entry ->
              pool.execute {
                  try {
                      val endpoint = endpointFor(entry.substringAfter("|", ""))
                      results[entry] = if (endpoint == null) -1L else tcpLatency(endpoint.first, endpoint.second)
                  } catch (_: Exception) {
                      results[entry] = -1L
                  } finally {
                      latch.countDown()
                  }
              }
          }
          thread(name = "happx-ping-results") {
              latch.await()
              pool.shutdown()
              runOnUiThread {
                  pingMs.putAll(results)
                  sortingByPing = true
                  refreshServers()
                  val reachable = results.values.count { it >= 0 }
                  Toast.makeText(this, "Проверка завершена: $reachable из ${targets.size} серверов доступны по TCP.", Toast.LENGTH_LONG).show()
              }
          }
          }

          private fun endpointFor(link: String): Pair<String, Int>? {
          if (link.startsWith("vmess://", true)) {
              val encoded = link.substringAfter("://").substringBefore("#").trim()
              val jsonText = runCatching {
                  String(Base64.decode(encoded, Base64.DEFAULT or Base64.URL_SAFE), Charsets.UTF_8)
              }.getOrNull() ?: return null
              val json = JSONObject(jsonText)
              val host = json.optString("add").trim()
              val port = json.optString("port").toIntOrNull() ?: json.optInt("port", -1)
              return if (host.isNotBlank() && port in 1..65535) host to port else null
          }
          val uri = runCatching { URI(link) }.getOrNull() ?: return null
          val host = uri.host?.takeIf { it.isNotBlank() } ?: return null
          val port = uri.port
          return if (port in 1..65535) host to port else null
          }

          private fun tcpLatency(host: String, port: Int): Long {
          Socket().use { socket ->
              val started = SystemClock.elapsedRealtime()
              socket.connect(InetSocketAddress(host, port), 1800)
              return (SystemClock.elapsedRealtime() - started).coerceAtLeast(1L)
          }
          }

          '''
          code = code[:start] + import_method + code[end:]

          require_replace(
              "        serverList.removeAllViews()\n",
              "        serverList.removeAllViews()\n        if (::sortButton.isInitialized) sortButton.text = if (sortingByPing) \"Сортировка: пинг\" else \"Без сортировки\"\n",
              "sort label"
          )
          require_replace(
              "        servers.forEachIndexed { index, entry ->\n",
              "        val displayServers = if (sortingByPing) servers.sortedWith(compareBy<String> { pingMs[it] ?: Long.MAX_VALUE }.thenBy { it.substringBefore(\"|\") }) else servers.toList()\n        displayServers.forEach { entry ->\n            val index = servers.indexOf(entry)\n",
              "display sort"
          )
          require_replace(
              "            info.addView(label(name, 15, text, true))\n",
              "            info.addView(label(name, 15, text, true))\n            val latency = pingMs[entry]\n            info.addView(label(if (latency == null) \"TCP: не проверен\" else if (latency >= 0) \"TCP: ${latency} ms\" else \"TCP: нет ответа\", 11, muted, false).apply { setPadding(0, dp(3), 0, 0) })\n",
              "latency label"
          )

          main.write_text(code)

          manifest = Path("stage/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              xml = manifest.read_text()
              if "android.permission.INTERNET" not in xml:
                  xml = re.sub(r"(<manifest\b[^>]*>)", r"\1\n    <uses-permission android:name=\"android.permission.INTERNET\" />", xml, count=1)
                  manifest.write_text(xml)
          else:
              raise SystemExit("AndroidManifest.xml not found; cannot enable subscription networking")
          print("Patched subscription downloading, VLESS/VMess/Trojan extraction, TCP latency checks, ping sorting, and INTERNET permission.")
          PY

      - name: Integrate Xray core with Android VPN service
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path("stage/app/src/main/java/app/happx")
          app.mkdir(parents=True, exist_ok=True)

          # libbox and libXray each embed a Go runtime; do not load sing-box in
          # the same process as Xray.
          (app / "HappXApplication.kt").write_text("""package app.happx

          import android.app.Application

          class HappXApplication : Application()
          """.replace("          ", ""))

          (app / "XrayConfigBuilder.kt").write_text(r'''package app.happx

          import libXray.LibXray
          import org.json.JSONObject
          import java.net.URLDecoder
          import java.nio.charset.StandardCharsets

          data class ParsedXrayProfile(val name: String, val configJson: String)

          object XrayConfigBuilder {
              fun parseShareLink(link: String): ParsedXrayProfile {
                  val request = JSONObject()
                      .put("apiVersion", 3)
                      .put("method", "convertShareLinksToXrayJson")
                      .put("payload", JSONObject().put("text", link))
                      .toString()
                  val response = JSONObject(LibXray.invoke(request))
                  if (!response.optBoolean("success")) {
                      throw IllegalArgumentException(response.optString("error").ifBlank { "Xray не распознал ссылку" })
                  }
                  val outbounds = response.optJSONObject("data")?.optJSONArray("outbounds")
                      ?: throw IllegalArgumentException("Xray не вернул конфигурацию сервера")
                  if (outbounds.length() == 0) throw IllegalArgumentException("В ссылке нет поддерживаемого сервера")
                  val outbound = outbounds.getJSONObject(0)
                  val tag = outbound.optString("tag").ifBlank { "proxy" }
                  outbound.put("tag", tag)
                  val rawName = link.substringAfter("#", "").takeIf { it.isNotBlank() } ?: tag
                  val name = runCatching {
                      URLDecoder.decode(rawName, StandardCharsets.UTF_8.name())
                  }.getOrDefault(rawName).ifBlank { tag }
                  return ParsedXrayProfile(name, outbound.toString())
              }
          }
          '''.replace("          ", ""))

          service = app / "HappXVpnService.kt"
          service.write_text(r'''package app.happx

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Intent
          import android.net.VpnService
          import android.os.Build
          import android.os.IBinder
          import android.util.Log
          import libXray.DialerController
          import libXray.LibXray
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.concurrent.atomic.AtomicBoolean
          import kotlin.concurrent.thread

          class HappXVpnService : VpnService(), DialerController {
              private var tun: android.os.ParcelFileDescriptor? = null
              private val running = AtomicBoolean(false)
              private val lock = Any()

              override fun protectFd(fd: Long): Boolean = protect(fd.toInt())

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      stopTunnel()
                      stopForeground(true)
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  createNotificationChannel()
                  startForeground(NOTIFICATION_ID, notification())
                  val outbound = intent?.getStringExtra(EXTRA_OUTBOUND)
                  if (outbound.isNullOrBlank()) {
                      publishState("error", "Не выбрана конфигурация Xray")
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  thread(name = "HappX-Xray-start") { startTunnel(outbound) }
                  return START_NOT_STICKY
              }

              private fun startTunnel(outboundJson: String) {
                  synchronized(lock) {
                      stopTunnelLocked()
                      try {
                          val outbound = JSONObject(outboundJson)
                          val outboundTag = outbound.optString("tag").ifBlank { "proxy" }
                          outbound.put("tag", outboundTag)

                          tun = Builder()
                              .setSession("HappX Xray")
                              .setMtu(1500)
                              .addAddress("10.111.0.1", 32)
                              .addRoute("0.0.0.0", 0)
                              .addDnsServer("1.1.1.1")
                              .establish()
                              ?: throw IllegalStateException("Android не выдал TUN-интерфейс")

                          LibXray.registerDialerController(this)
                          LibXray.setDNS(this, "1.1.1.1:53")

                          val inbounds = JSONArray().put(
                              JSONObject()
                                  .put("tag", "happx-tun")
                                  .put("protocol", "tun")
                                  .put("settings", JSONObject().put("name", "HappX").put("mtu", 1500))
                          )
                          val outbounds = JSONArray()
                              .put(outbound)
                              .put(JSONObject().put("tag", "direct").put("protocol", "freedom").put("settings", JSONObject()))
                          val routingRules = JSONArray().put(
                              JSONObject()
                                  .put("type", "field")
                                  .put("inboundTag", JSONArray().put("happx-tun"))
                                  .put("outboundTag", outboundTag)
                          )
                          val config = JSONObject()
                              .put("log", JSONObject().put("loglevel", "warning"))
                              .put("inbounds", inbounds)
                              .put("outbounds", outbounds)
                              .put("routing", JSONObject().put("domainStrategy", "AsIs").put("rules", routingRules))
                              .put("env", JSONObject().put("xray.tun.fd", tun!!.fd.toString()))
                          val request = JSONObject()
                              .put("apiVersion", 3)
                              .put("method", "runXray")
                              .put("payload", JSONObject().put("xrayJson", config.toString()))
                              .toString()
                          val response = JSONObject(LibXray.invoke(request))
                          if (!response.optBoolean("success")) {
                              throw IllegalStateException(response.optString("error").ifBlank { "Xray не смог запуститься" })
                          }
                          running.set(true)
                          publishState("connected", "Xray запущен")
                          Log.i(TAG, "Xray core started")
                      } catch (e: Exception) {
                          Log.e(TAG, "Xray start failed", e)
                          stopTunnelLocked()
                          publishState("error", e.message ?: "Ошибка запуска Xray")
                          stopForeground(true)
                          stopSelf()
                      }
                  }
              }

              private fun stopTunnel() {
                  synchronized(lock) { stopTunnelLocked() }
              }

              private fun stopTunnelLocked() {
                  if (running.getAndSet(false)) {
                      runCatching {
                          LibXray.invoke(JSONObject().put("apiVersion", 3).put("method", "stopXray").put("payload", JSONObject()).toString())
                      }.onFailure { Log.w(TAG, "Xray stop warning", it) }
                  }
                  runCatching { LibXray.resetDNS() }
                  runCatching { tun?.close() }
                  tun = null
                  publishState("disconnected", "Отключено")
              }

              private fun publishState(state: String, message: String) {
                  getSharedPreferences("happx_vpn", MODE_PRIVATE).edit()
                      .putString("state", state).putString("message", message).apply()
                  sendBroadcast(Intent(ACTION_STATE).setPackage(packageName)
                      .putExtra(EXTRA_STATE, state).putExtra(EXTRA_MESSAGE, message))
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      val manager = getSystemService(NotificationManager::class.java)
                      manager.createNotificationChannel(NotificationChannel(CHANNEL_ID, "HappX VPN", NotificationManager.IMPORTANCE_LOW))
                  }
              }

              private fun notification(): Notification {
                  val pending = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_UPDATE_CURRENT or (if (Build.VERSION.SDK_INT >= 23) PendingIntent.FLAG_IMMUTABLE else 0)
                  )
                  return if (Build.VERSION.SDK_INT >= 26) {
                      Notification.Builder(this, CHANNEL_ID)
                          .setSmallIcon(android.R.drawable.stat_sys_warning)
                          .setContentTitle("HappX Xray")
                          .setContentText("VPN-служба работает")
                          .setContentIntent(pending).setOngoing(true).build()
                  } else {
                      @Suppress("DEPRECATION")
                      Notification.Builder(this)
                          .setSmallIcon(android.R.drawable.stat_sys_warning)
                          .setContentTitle("HappX Xray")
                          .setContentText("VPN-служба работает")
                          .setContentIntent(pending).setOngoing(true).build()
                  }
              }

              override fun onDestroy() {
                  stopTunnel()
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = super.onBind(intent)

              companion object {
                  const val ACTION_START = "app.happx.action.START_XRAY"
                  const val ACTION_STOP = "app.happx.action.STOP_XRAY"
                  const val ACTION_STATE = "app.happx.action.XRAY_STATE"
                  const val EXTRA_OUTBOUND = "xray_outbound"
                  const val EXTRA_STATE = "xray_state"
                  const val EXTRA_MESSAGE = "xray_message"
                  private const val TAG = "HappX-Xray"
                  private const val CHANNEL_ID = "happx_vpn"
                  private const val NOTIFICATION_ID = 821
              }
          }
          '''.replace("          ", ""))

          main = app / "MainActivity.kt"
          code = main.read_text()
          code = code.replace("SingBoxConfigBuilder.parseShareLink", "XrayConfigBuilder.parseShareLink")
          # ParsedXrayProfile exposes name/configJson, not the old sing-box profile type.
          code = code.replace(".type", ".name")

          start = code.index("    private fun requestConnection() {")
          end = code.index("    @Deprecated(\"Legacy callback kept for broad Android compatibility\")", start)
          replacement = r'''    private fun requestConnection() {
                  if (connected) {
                      startService(Intent(this, HappXVpnService::class.java).setAction(HappXVpnService.ACTION_STOP))
                      connected = false
                      status.text = "Отключение…"
                      connectButton.text = "⏻   ПОДКЛЮЧИТЬ"
                      return
                  }
                  if (servers.isEmpty()) {
                      Toast.makeText(this, "Сначала добавь ссылку сервера или подписку.", Toast.LENGTH_LONG).show()
                      return
                  }
                  if (selectedIndex !in servers.indices) {
                      Toast.makeText(this, "Сначала выбери сервер из списка.", Toast.LENGTH_LONG).show()
                      return
                  }
                  val selected = servers[selectedIndex]
                  val outbound = serverConfigs[selected]
                  if (outbound.isNullOrBlank()) {
                      Toast.makeText(this, "Не удалось подготовить Xray-конфигурацию. Импортируй VLESS, VMess или Trojan.", Toast.LENGTH_LONG).show()
                      return
                  }
                  val prepare = VpnService.prepare(this)
                  if (prepare != null) {
                      startActivityForResult(prepare, 700)
                  } else {
                      launchXray(outbound)
                  }
              }

              private fun launchXray(outbound: String) {
                  val intent = Intent(this, HappXVpnService::class.java)
                      .setAction(HappXVpnService.ACTION_START)
                      .putExtra(HappXVpnService.EXTRA_OUTBOUND, outbound)
                  if (android.os.Build.VERSION.SDK_INT >= 26) startForegroundService(intent) else startService(intent)
                  status.text = "Запуск Xray…"
                  connectButton.text = "Отключить"
              }

              private val xrayStateReceiver = object : android.content.BroadcastReceiver() {
                  override fun onReceive(context: android.content.Context?, intent: Intent?) {
                      val state = intent?.getStringExtra(HappXVpnService.EXTRA_STATE) ?: return
                      val message = intent.getStringExtra(HappXVpnService.EXTRA_MESSAGE) ?: state
                      connected = state == "connected"
                      if (::status.isInitialized) status.text = message
                      if (::connectButton.isInitialized) connectButton.text = if (connected) "Отключить" else "⏻   ПОДКЛЮЧИТЬ"
                  }
              }

              override fun onResume() {
                  super.onResume()
                  val filter = android.content.IntentFilter(HappXVpnService.ACTION_STATE)
                  if (android.os.Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(xrayStateReceiver, filter, android.content.Context.RECEIVER_NOT_EXPORTED)
                  } else {
                      @Suppress("DEPRECATION")
                      registerReceiver(xrayStateReceiver, filter)
                  }
                  val saved = getSharedPreferences("happx_vpn", MODE_PRIVATE)
                  connected = saved.getString("state", "disconnected") == "connected"
                  if (::status.isInitialized) status.text = saved.getString("message", "Отключено")
                  if (::connectButton.isInitialized) connectButton.text = if (connected) "Отключить" else "⏻   ПОДКЛЮЧИТЬ"
              }

              override fun onPause() {
                  runCatching { unregisterReceiver(xrayStateReceiver) }
                  super.onPause()
              }

          '''
          code = code[:start] + replacement + code[end:]
          # Replace old permission callback with real Xray startup.
          callback_start = code.index("    @Deprecated(\"Legacy callback kept for broad Android compatibility\")")
          callback_end = code.index("    private fun showImportDialog() {", callback_start)
          callback = r'''    @Deprecated("Legacy callback kept for broad Android compatibility")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 700 && resultCode == RESULT_OK && selectedIndex in servers.indices) {
                      val selected = servers[selectedIndex]
                      val outbound = serverConfigs[selected]
                      if (!outbound.isNullOrBlank()) launchXray(outbound)
                  } else if (requestCode == 700) {
                      Toast.makeText(this, "Разрешение VPN не выдано.", Toast.LENGTH_LONG).show()
                  }
              }

          '''
          code = code[:callback_start] + callback + code[callback_end:]
          # Add missing state/receiver imports and remove accidental duplicate registrations.
          if "import android.content.BroadcastReceiver" not in code:
              code = code.replace("import android.content.Intent\n", "import android.content.Intent\nimport android.content.BroadcastReceiver\n")
          main.write_text(code)

          manifest = Path("stage/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()
          if "android.permission.FOREGROUND_SERVICE" not in xml:
              xml = xml.replace("<uses-permission android:name=\"android.permission.INTERNET\" />",
                  "<uses-permission android:name=\"android.permission.INTERNET\" />\n    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />\n    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_SPECIAL_USE\" />")
          xml = xml.replace('android:exported="false">\n            <intent-filter>',
              'android:exported="false"\n            android:foregroundServiceType="specialUse">\n            <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="VPN tunnel for Xray proxy" />\n            <intent-filter>')
          manifest.write_text(xml)

          gradle = Path("stage/app/build.gradle.kts")
          gs = gradle.read_text()
          gs = gs.replace('    // sing-box native Android engine (GPL-3.0). Runtime bridge is documented separately.\n    implementation("com.github.singbox-android:libbox:1.14.3")',
                          '    implementation(files("libs/libXray.aar"))')
          if 'implementation(files("libs/libXray.aar"))' not in gs:
              gs = re.sub(r'dependencies\s*\{', 'dependencies {\n    implementation(files("libs/libXray.aar"))', gs, count=1)
          gradle.write_text(gs)
          print("Integrated official XTLS/libXray AAR, Android TUN service, profile parsing, and real start/stop actions.")
          PY

      - name: Configure ARM64-only APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("stage/app/build.gradle.kts")
          s = p.read_text()
          if "isUniversalApk = false" not in s:
              block = '''
              splits {
                  abi {
                      isEnable = true
                      reset()
                      include("arm64-v8a")
                      isUniversalApk = false
                  }
              }
          '''
              s, n = re.subn(r'(android\s*\{)', lambda m: m.group(1) + block, s, count=1)
              if n != 1:
                  raise SystemExit("Could not configure Android ABI split")
              p.write_text(s)
          print("Configured ARM64-only APK")
          PY

      - name: Set up Gradle (project archive has no gradlew wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build smaller ARM64 APKs
        run: |
          test -f stage/settings.gradle.kts || test -f stage/settings.gradle
          gradle -p stage --no-daemon assembleDebug assembleRelease

      - name: Report APK size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [p for p in Path("stage").glob("**/build/outputs/apk/**/*.apk") if "debug" in p.parts or "release" in p.parts]
          if not files:
              raise SystemExit("No APKs were produced")
          limit = 100 * 1024 * 1024
          for apk in files:
              size = apk.stat().st_size
              print(f"APK: {apk}")
              print(f"Size: {size:,} bytes ({size / 1024 / 1024:.2f} MiB)")
              print(f"Target: 100 MiB — {'PASS' if size <= limit else 'OVER TARGET'}")
          PY

      - name: Upload installable arm64 debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HappX-debug-arm64-APK
          path: stage/**/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Sign release APK for direct installation
        run: |
          set -euo pipefail
          APK="stage/app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk"
          test -f "$APK"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          APKSIGNER="$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found under Android SDK: $SDK"
            find "$SDK" -maxdepth 4 -type f -name apksigner -print || true
            exit 1
          fi
          KEY="$HOME/.android/debug.keystore"
          mkdir -p "$(dirname "$KEY")"
          if [ ! -f "$KEY" ]; then
            keytool -genkeypair -v -keystore "$KEY" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          "$APKSIGNER" sign --ks "$KEY" --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey "$APK"
          "$APKSIGNER" verify --verbose "$APK"
          mv "$APK" stage/app/build/outputs/apk/release/HappX-arm64-release.apk

      - name: Upload arm64 release APK (signed for testing)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HappX-release-arm64-signed
          path: stage/app/build/outputs/apk/release/HappX-arm64-release.apk
          if-no-files-found: error
          retention-days: 7
