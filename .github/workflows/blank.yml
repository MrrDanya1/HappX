name: HappX Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract engine-stage archive
        run: |
          if [ -f "HappX-Android-engine-stage.zip" ]; then
            mkdir -p stage
            unzip -o "HappX-Android-engine-stage.zip" -d stage
          else
            echo "::warning::HappX-Android-engine-stage.zip not found; checking repository files directly."
          fi

      - name: Locate Gradle Android project
        shell: bash
        run: |
          WRAPPER="$(find . -type f -name gradlew -not -path './.git/*' -not -path '*/.gradle/*' -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "::error::No gradlew found. The archive must contain a Gradle project with its wrapper."
            find . -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"
          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::Gradle settings file not found next to gradlew in $PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$WRAPPER"
          echo "Found project at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HappX-debug-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
